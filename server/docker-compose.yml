#version: "3.9"
services:
  app:
    container_name: udyk-ce-app
    image: registry.cn-heyuan.aliyuncs.com/udyk/udyk-ce-app:latest
    privileged: true
    restart: always
    expose:
      - 8080
    ports:
      - "28080:8080"
    environment:
      TZ: "Asia/Shanghai"
      LANG: "C.UTF-8"
    depends_on:
      - redis
      - db
    volumes:
      - "/var/lib/udyk-ce/app:/app"
      - "/tmp:/tmp"
        

  redis:
    container_name: udyk-ce-redis
    restart: "always"
    image: registry.cn-heyuan.aliyuncs.com/udyk/redis:4.0
    command: redis-server --bind 0.0.0.0 --appendonly yes
    environment:
      TZ: "Asia/Shanghai"
      LANG: "C.UTF-8" 
    volumes:
      - /var/lib/udyk-ce/redis:/data
    expose:
      - 6379

  db:
    container_name: udyk-ce-db
    restart: "always"
    image: registry.cn-heyuan.aliyuncs.com/udyk/mysql:8.0.3
    expose:
      - 3306
    volumes:
      - /var/lib/udyk-ce/mysql:/var/lib/mysql
    environment:
      LANG: "C.UTF-8" 
      TZ: "Asia/Shanghai"
      MYSQL_ROOT_PASSWORD: "udyk@2023"
